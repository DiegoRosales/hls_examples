# Kernel features PYNQ needs to talk to the PL on Zynq-7000.
# Without the FPGA manager, /sys/class/fpga_manager/fpga0 is absent and PYNQ
# reports "No Devices Found" when constructing an Overlay.

# FPGA manager: binds the DT devcfg node (xlnx,zynq-devcfg-1.0) and creates
# /sys/class/fpga_manager/fpga0, which PYNQ uses to download bitstreams and to
# register an EmbeddedDevice.
CONFIG_FPGA=y
CONFIG_FPGA_MGR_ZYNQ_FPGA=y
CONFIG_FPGA_BRIDGE=y
CONFIG_FPGA_REGION=y
CONFIG_OF_FPGA_REGION=y

# UIO: userspace access to PL IP blocks (pynq MMIO / interrupts).
CONFIG_UIO=y
CONFIG_UIO_PDRV_GENIRQ=y

# Xilinx xlnk / APF: the CMA allocator that backs pynq allocate().
CONFIG_XILINX_APF=y
CONFIG_XILINX_DMA_APF=y

# Contiguous Memory Allocator pool for allocate() buffers.
CONFIG_CMA=y
CONFIG_DMA_CMA=y
CONFIG_CMA_SIZE_MBYTES=128

# Allow /dev/mem so pynq.MMIO can map PL registers.
# CONFIG_STRICT_DEVMEM is not set
